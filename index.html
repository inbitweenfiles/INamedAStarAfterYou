<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INamedAStarAfterYou</title>    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&family=Cinzel:wght@400..900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background-color:  #FFF8E7;
            color: rgb(12, 12, 12);
            font-family: "Cinzel", serif;
        }
        h1 {
            font-family: "Cinzel", serif;
            text-align: center;
            margin-bottom: 30px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        .custom-btn {
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
            padding: 28px 20px;
            border: 4px solid #fdfcfb;
            border-radius: 18px;
            background: #FFF8E7;
            color: black;
            font-family: "Cinzel", serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;

            text-align: center;
            cursor: pointer;

            transition: transform 0.25s ease,
                        box-shadow 0.25s ease;
        }

        .custom-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        }

        .custom-btn:focus-visible {
            outline: 4px solid #f5d98b;
            outline-offset: 4px;
        }

        .custom-btn h2,
        .custom-btn p {
            margin: 0;
        }
        .custom-btn .star {
            color: var(--star-color, #f5d98b);
        }

        .star {
            color: var(--star-color, #f5d98b);
            font-size: 64px;
            line-height: 1.2;
            text-decoration: #f6f7fb;
            text-shadow: 0 0 12px #fff, 0 0 25px var(--star-color, #f5d98b);
        }

        #star-detail {
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
            box-sizing: border-box;
        }

        #star-grid[hidden],
        #star-detail[hidden] {
            display: none;
        }

        .detail-content {
            position: relative;
            padding: 55px 30px 40px;
            border: 4px solid #fdfcfb;
            border-radius: 24px;
            background: #FFF8E7;
            color: black;
            text-align: center;

            
            animation: star-expand 0.35s ease-out;
            
            transform: translateY(-5px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        }

        #detail-star {
            display: block;
            font-size: 120px;
            margin-bottom: 20px;
            
        }

        #detail-title {
            font-size: 32px;
            margin: 0 0 16px;
        }

        #detail-description {
            font-size: 15px;
            line-height: 1.9;
        }

        #close-detail {
            position: absolute;
            top: 12px;
            right: 16px;

            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;

            background: rgba(255, 255, 255, 0.12);
            color: black;
            font-size: 30px;
            line-height: 1;

            cursor: pointer;
        }

        #close-detail:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        #gift-button {
            display: block;
            width: 20%;
            margin-top: 20px;
            padding: 16px 20px;

            border: 1px solid #fdfcfb;
            border-radius: 12px;
            background: #f7f6f6;
            color: #0a2351;

            font-family: "Cinzel", serif;
            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
            margin-bottom: 20px;
            transition: transform 0.2s ease,
                        background 0.2s ease;
        }

        #gift-button:hover {
            background: white;
            transform: translateY(-2px);
        }

        #gift-button:focus-visible,
        #close-detail:focus-visible {
            outline: 3px solid white;
            outline-offset: 4px;
        }
        [hidden] {
            display: none;
        }
        .gift-form {
            
            border: 1px solid #f3f2f1;
            border-radius: 12px;
            background: #f3f2f1;
            color: #0a2351;
            text-align: center;

            font-family: "Cinzel", serif;
            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
            transition: transform 0.2s ease,
                        background 0.2s ease;
        }
        .gift-form hover {
            background: white;
            transform: translateY(-2px);
        }
        .submit-button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #fbfbfa;
            cursor: pointer;
            font: inherit;
            font-weight: bold;
        }

        


        @keyframes star-expand {
            from {
                opacity: 0;
                transform: scale(0.85);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (max-width: 700px) {
            .grid-container {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 14px;
                padding: 14px;
            }

            .custom-btn {
                padding: 24px 12px;
            }

            #star-detail {
                margin: 15px auto;
            }

            #detail-star {
                font-size: 95px;
            }
        }

        @media (max-width: 420px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }
        #signup-page {
            min-height: 75vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            box-sizing: border-box;
        }

        #signup-form {
            width: 100%;
            max-width: 380px;
            min-height: 300px;
            box-sizing: border-box;
            padding: 36px 28px;
            border: 2px solid #f5d98b;
            border-radius: 20px;
            background: #fffdf6;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.10);

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: stretch;
            gap: 16px;
        }

        #signup-form label {
            text-align: center;
            font-weight: bold;
        }

        #sender-email {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            border: 1px solid #f8f7f5;
            border-radius: 10px;
            background: white;
            font: 14px Arial, sans-serif;
        }

        .proceed {
            padding: 13px;
            border: 0;
            border-radius: 10px;
            background: #f6f7fb;
            color: #252014;
            font-family: "Cinzel", serif;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .proceed:hover {
            background: #FFF8E7;
            transform: translateY(-2px);
        }

        #email-status {
            margin: 0;
            text-align: center;
            font-size: 13px;
        }

        #signup-page[hidden] {
            display: none;
        }

        #star-detail {
            position: fixed;
            inset: 0;
            z-index: 1000;

            width: 100%;
            height: 100%;
            max-width: none;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            background: rgba(20, 16, 10, 0.55);
            backdrop-filter: blur(4px);
        }

        #star-detail[hidden] {
            display: none;
        }

        .detail-content {
            position: center;
            width: 100%;
            max-width: 480px;
            max-height: 80vh;
            overflow-y: auto;
            box-sizing: border-box;

            padding: 55px 30px 40px;
            border: 3px solid #f5d98b;
            border-radius: 24px;

            background: #fff8e7;
            color: black;
            text-align: center;

            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
            animation: star-expand 0.3s ease-out;
        }

        #detail-star {
            display: block;
            font-size: 120px;
            line-height: 1.2;
            margin-bottom: 20px;
            color: var(--star-color, #f5d98b);
            text-shadow: 0 0 12px #fff,
                        0 0 25px var(--star-color, #f5d98b),
                        0 0 40px var(--star-color, #f5d98b);
        }

        @media (max-width: 480px) {
            .detail-content {
                padding: 50px 20px 30px;
            }

            #detail-star {
                font-size: 95px;
            }
        }


        

    </style>
</head>
<body>
    <h1> I Named A Star After You </h1>
    <section id="signup-page" class="signup-form">
        <form id="signup-form">
            <label for="sender-email">Enter your email:</label>
            <input               
                type="email"
                id="sender-email"
                name="senderEmail"
                placeholder="name@gmail.com"
                autocomplete="email"
                maxlength="254"
                required
            > 
            <br>
            <button class="proceed" type="submit">Proceed</button> 
            <p id="email-status" role="status" aria-live="polite"></p>
        </form>
    </section>
    <div class="grid-container" id="star-grid" hidden>  
        <button class="custom-btn" id="star1" data-color= "#FFEF00">
            <span class="star" aria-hidden="true">  ★ </span>
                <h2> Yuri </h2>
                <p> Traits: Optimistic, Joyful, Bright</p>
        </button>
        <button class="custom-btn" id="star2" data-color= "#9A9AEB">
                <span class="star" aria-hidden="true">  ★ </span>
                <h2> Nora </h2>
                <p> Traits: Courageous, Resilient</p>
                
        </button>
        <button class="custom-btn" id="star3" data-color="#98C261">
                <span class="star" aria-hidden="true"> ★ </span>
                <h2> Mint </h2>
                <p> Traits: Peaceful, Calm </p>
                
         </button>
        <button class="custom-btn" id="star4" data-color="#9B111E">
                <span class="star" aria-hidden="true">   ★ </span>
                <h2> Ruby </h2>
                <p> Traits: Ambitious, Independent, Competent </p>
                
        </button>
        <button class="custom-btn" id="star5" data-color="#87CEEB">
                <span class="star" aria-hidden="true">  ★ </span>
                <h2> Sky </h2>
                <p> Traits: Loyal, Responsible </p>
                
        </button>
        <button class="custom-btn" id="star6" data-color="#BE7C2B">
                <span class="star" aria-hidden="true">  ★ </span>
                <h2> Toffee </h2>
                <p> Traits: Reliable, Honest </p>
                
        </button>
        <button class="custom-btn" id="star7" data-color="#FFD1DF">
                <span class="star" aria-hidden="true">  ★ </span>
                <h2> Mauve </h2>
                <p> Traits: Caring, Warm </p>
                
        </button>
        
    </div>

    <section id="star-detail" hidden aria-labelledby="detail-title">

        <div class="detail-content">

            <button id="close-detail" type="button"
                    aria-label="Close enlarged star">×</button>

            <span id="detail-star" class="star" aria-hidden="true">✦</span>

            <h2 id="detail-title"></h2>

            <p id="detail-description"></p>

        </div>

        <button id="gift-button" type="button">
            Gift this star
        </button>
        <form class="gift-form" id="giftForm" hidden>
            <label for="sender-name">Name:</label>
            <input               
                type="text"
                id="sender-name"
                name="senderName"
                placeholder="Your Name"
                autocomplete="name"
                maxlength="100"
                required
            >
            <br>
            <label for="sender-message">Message:</label>
            <input
                type="text"
                id="sender-message"
                name="senderMessage"
                placeholder="Optional Message"
            >
            <br>
            
            <label for="recipient-email">To:</label>

            <input
                
                type="email"
                id="recipient-email"
                name="recipientEmail"
                placeholder="name@gmail.com"
                autocomplete="email"
                maxlength="254"
                required
            >
            <br>

            <button class="submit-button" type="submit">
                Send the star
            </button>

            <p id="status" role="status" aria-live="polite"></p>

        </form>
        <p id="recipient-message" hidden></p>
    </section>
    <script type = "module" src="src/app.js"></script>
</body>
</html>
